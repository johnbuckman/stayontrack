name: StayOnTrack
options:
  bundleIdPrefix: com.johnbuckman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  StayOnTrack:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: StayOnTrackWidgets
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Stay on Track
        CFBundleShortVersionString: "1.1.4"
        CFBundleVersion: "18"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - location
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - waze
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        NSLocationWhenInUseUsageDescription: "Stay on Track uses your location to follow the hike and warn you when you drift off-trail."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Stay on Track keeps following your hike in the background so it can speak turns and warn you off-trail with the screen off."
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX Track
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.topografix.gpx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX Track
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnbuckman.stayontrack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Dev build target: Mac Catalyst so we can run and test on the Mac.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Ad-hoc sign so the Catalyst app runs locally without a team.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  StayOnTrackWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StayOnTrackWidgets
      - path: Sources/Shared/HikeActivityAttributes.swift   # shared with the app target
    info:
      path: StayOnTrackWidgets/Info.plist
      properties:
        CFBundleDisplayName: Stay on Track
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnbuckman.stayontrack.widgets
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
